server.port=${SERVER_PORT:8000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/traffic_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
server.error.include-message=always
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=2GB
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
